<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính Cơ Bản</title>
    <script src="cal.js"></script>
    
    <script>
        function xuly(pt) {
            let inputA = document.getElementById("hsa").value;
            let inputB = document.getElementById("hsb").value;
            let a = parseFloat(inputA);
            let b = parseFloat(inputB);

            if (isNaN(a) || isNaN(b)) {
                document.getElementById("ketqua").innerText = "Lỗi: Vui lòng nhập số hợp lệ!";
                return; // Dừng hàm lại, không tính toán tiếp
            }

            let kq = thuchienpheptoan(a, b, pt);
            document.getElementById("ketqua").innerText = kq;
        }
    </script>
</head>
<body>
    <form>
        <table border="1" cellpadding="10" style="border-collapse: collapse;">
            <tr>
                <td>Hệ số a:</td>
                <td><input type="number" id="hsa" name="hsa"></td>
            </tr>
            <tr>
                <td>Hệ số b:</td>
                <td><input type="number" id="hsb" name="hsb"></td>
            </tr>
            <tr>
                <td>Kết quả:</td>
                <td><strong id="ketqua" style="color: red;"></strong></td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;">
                    <input type="button" value="Cộng" onclick="xuly('+')">
                    <input type="button" value="Trừ" onclick="xuly('-')">
                    <input type="button" value="Nhân" onclick="xuly('*')">
                    <input type="button" value="Chia" onclick="xuly('/')">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
