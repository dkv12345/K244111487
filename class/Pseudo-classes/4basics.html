<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Link States</title>
    <style>
        .my_link {
            font-family: Arial;
            font-size: 30px;
            font-weight: bold;
            transition: all 0.3s;
        }
        a.my_link:link {
            font-style: italic;
        }
        a.my_link:hover {
            cursor: pointer;
            color: yellow;
            background-color: green;
        }
        a.my_link:visited {
            color: red;
        }
        a.my_link:active {
            color: white;
            background-color: green;
        }

    </style>
<body>
    <h2>Hiệu ứng chuyển trạng thái Link</h2>

    <p>Rê chuột vào link bên dưới, sau đó giữ chuột trái để xem sự thay đổi</p>
    <a href="http://127.0.0.1:5500/ex33/internalstyle.html" class="my_link" target="blank">Khám phá</a>
</body>

</html>
