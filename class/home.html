<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Course</title>
    <style>
        /* Ẩn form ban đầu và chuẩn bị class để show */
        .form-box { display: none; max-width: 360px; margin-top: 1rem; }
        .form-box.show { display: block; }
        /* Tối giản style để nhìn rõ khi test */
        .form-box form { border: 1px solid #ddd; padding: 1rem; border-radius: 6px; }
        .form-box input { display: block; width: 100%; margin: .4rem 0; padding: .5rem; }
    </style>
</head>
<body>
    <h1>Welcome to my course!</h1>
    <h2>This course is for beginners</h2>
    
    <!-- Thêm id để JS dễ bắt sự kiện click -->
    <button id="register-btn" type="button">Register now</button>

    <div class="form-box" id="login-form">
        <form action="/login" method="POST">
            <h3>Log in</h3>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" name="login">Log in</button>
            <p>Don't have an account? <a href="#">Register</a></p>
        </form>
    </div>
    
    <script>
        // Bật/tắt hiển thị form khi bấm nút
        (function(){
            const btn = document.getElementById('register-btn');
            const formBox = document.getElementById('login-form');
            if (!btn || !formBox) return; // an toàn khi phần tử không tồn tại
            btn.addEventListener('click', function(e){
                formBox.classList.toggle('show');
                // optional: focus vào input đầu tiên khi mở
                if (formBox.classList.contains('show')) {
                    const firstInput = formBox.querySelector('input');
                    if (firstInput) firstInput.focus();
                }
            });
        })();
    </script>
</body>
</html>
