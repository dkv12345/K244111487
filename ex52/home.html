<!DOCTYPE html>
<html>
<head>
    <title>Contact - GET</title>
    <style>
        .form-box {
            border: 1px solid rgb(204, 204, 204);
            width: 600px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .btn-send {
            background-color: rgb(153, 34, 68); 
            color: white;
            border: none;
            padding: 8px 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="form-box">
        <h3 style="margin-top: 0;">Contact the editorial office</h3>
        
        <form action="trang-moi.html" method="GET">
            
            <p>Full name<br>
               <input type="text" name="fullname" style="width: 100%;">
            </p>

            <table style="width: 100%; border: none;">
                <tr>
                    <td style="width: 50%; padding-right: 10px;">
                        Email<br>
                        <input type="text" name="email" style="width: 100%;">
                    </td>
                    <td style="width: 50%;">
                        Send to<br>
                        <select name="department" style="width: 100%;">
                            <option value="Editorial board">Editorial board</option>
                            <option value="News Department">News Department</option>
                            <option value="Board of Perspectives">Board of Perspectives</option>
                            <option value="World Board">World Board</option>
                            <option value="Business Department">Business Department</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td style="padding-right: 10px; padding-top: 10px;">
                        Title<br>
                        <input type="text" name="title" style="width: 100%;">
                    </td>
                    <td></td>
                </tr>
            </table>

            <p>Content<br>
               <textarea name="message" style="width: 100%; height: 100px;"></textarea>
            </p>

            <input type="submit" value="Send" class="btn-send">
            
        </form>
    </div>

</body>
</html>
