<html>
<head>
    <title>Button</title>

    <!-- start with . => class -->
    <style>
        .subscribe-button { 
            background-color: rgb(200, 0, 0);
            color: white;
            border: none;
            height: 36px;
            width: 105px;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 8px;
        }

        .join-button {
            background-color: white;
            border-color: rgb(24, 141, 214);
            border-style: solid;
            border-width: 1px;
            color:  rgb(25, 143, 216);
            height: 36px;
            width: 62px;
            border-radius: 2px;
            cursor: pointer;
        }

        .twitter-button {
            background-color:rgb(34, 161, 240);
            color: white;
            border: none;
            height: 36px;
            width: 80px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            margin-left: 8px;
        }
    </style>
<!-- space = margin-->
<!-- button: CSS selector = which elements we're targeting 
In this case, we're targeting all buttons on the page and change the bg color to red
Inside the bracket = CSS property: CSS Value;-->

</head>

<body>

<!-- label the button, target each -->
<button class="subscribe-button">
    SUBSCRIBE
</button>

<button class="join-button">
    JOIN
</button>

<button class="twitter-button">
    Tweet
</button>

</body>
</html>
