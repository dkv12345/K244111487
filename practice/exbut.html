<html>
<head>
    <title>
        Buttons
    </title>
    <style>
        .uber-button {
            background-color: black;
            color: white;
            border: none;
            width: 110px;
            height: 40px;
            cursor: pointer;
        }

        .amazon-button {
            background-color: rgb(255, 216, 20);
            color: black;
            border: none;
            width: 155px;
            height: 35px;
            border-radius: 17px;
            font-size: 13px;
            margin-left: 10px;
            cursor: pointer;
        }

        .github-button {
            background-color: rgb(46, 164, 79);
            color: white;
            font-weight: bold;
            border: none;
            height: 35px;
            width: 85px;
            font-size: 13px;
            border-radius: 6px;
            margin-left: 8px;
            cursor: pointer;
        }

        .bootstrap_1 {
            background-color: rgb(121, 82, 179);
            color: white;
            border: none;
            border-radius: 3px;
            width: 110px;
            height: 35px;
            font-weight: bold;
            margin-left: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .bootstrap_2 {
            background-color: white;
            border-width: 1px;
            border-style: solid;
            border-color: rgb(121, 82, 179);
            margin-left: 8


        }

        
    </style>
</head>

<body>
    <button class="uber-button">
        Request now
    </button>

    <button class="amazon-button">
        Add to Cart
    </button>

    <button class="github-button">
        Sign up
    </button>

    <button class="bootstrap_1">
        Get started
    </button>

    <button class="bootstrap_2">
        Download
    </button>

    

</body>
</html>
